<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Piyasa verisinden kullanıcıya işlevsel akış</title>
  <desc id="desc">Piyasa verisi ve kullanıcı ayarları kuralların değerlendirilmesine girer. Koşullar uygunsa emir gönderilir; borsa sonucu ile durum ve pozisyon güncellenip kullanıcıya gösterilir.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6b6b6b" stroke-width="1.5"/></marker></defs>
  <rect width="1000" height="420" fill="#f4f4f5" rx="18"/>
  <g fill="white" stroke="#d9d9d9" stroke-width="2">
    <rect x="35" y="35" width="270" height="90" rx="12"/>
    <rect x="365" y="35" width="270" height="90" rx="12"/>
    <rect x="695" y="35" width="270" height="90" rx="12"/>
    <rect x="35" y="215" width="270" height="90" rx="12"/>
    <rect x="365" y="215" width="270" height="90" rx="12"/>
    <rect x="695" y="215" width="270" height="90" rx="12"/>
  </g>
  <g fill="none" stroke="#6b6b6b" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M305 80H355"/><path d="M635 80H685"/>
    <path d="M830 125V170H170V205"/>
    <path d="M305 260H355"/><path d="M635 260H685"/>
    <path d="M355 382H335V145H500V135"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="22" fill="#333333" text-anchor="middle">
    <text x="170" y="88">1. Piyasa verisi</text>
    <text x="500" y="74">2. Kuralları</text><text x="500" y="102">değerlendir</text>
    <text x="830" y="74">3. Koşullar uygunsa</text><text x="830" y="102">emir gönder</text>
    <text x="170" y="268">4. Borsadan sonuç</text>
    <text x="500" y="254">5. Durumu ve</text><text x="500" y="282">pozisyonu güncelle</text>
    <text x="830" y="268">6. Kullanıcıya göster</text>
    <rect x="355" y="360" width="290" height="45" rx="9" fill="#eef4e6"/>
    <text x="500" y="389" font-size="20">Kullanıcının ayarları</text>
  </g>
</svg>
